#Prefix is Ctrl-a
set -g prefix C-a
bind C-a send-prefix
unbind C-b

# Fix delay of ESC key on neovim
set -sg escape-time 20

# fix window rename
set-option -g allow-rename off

# scrollback size
set -g history-limit 50000

# set first window to index 1 (not 0) to map more to the keyboard layout
set -g base-index 1
setw -g pane-base-index 1

# color and terminal features
set -g default-terminal "tmux-256color"
if-shell '[ "$(uname -s)" = Darwin ]' 'set-option -g default-shell /Users/jruz/.nix-profile/bin/nu' 'set-option -g default-shell /home/jruz/.nix-profile/bin/nu'
set -as terminal-features ",xterm-256color:RGB"
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',*:extkeys'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# reload ~/.tmux.conf using Ctrl + a + r
bind r source-file ~/.tmux.conf \; display-popup -E -w 22 -h 3 'print --no-newline "\e[?25l   Config reloaded!"; sleep 1sec'
set -g @window-picker-max-width 152
bind w run-shell -b '~/.local/bin/tmux-window-picker open "#{client_name}" #{client_width}'

# reset tab name indicator
bind t run-shell 'TMUX_PANE=#{pane_id} ~/dev/projects/agent-config/hooks/tmux-tab-renamer reset'

# remove unused default bindings
unbind 0
unbind n
unbind p
unbind o
unbind \;

# rename window starting from an empty prompt
bind , command-prompt { rename-window "%%" }

# close window with confirmation
bind X confirm-before -p "kill-window #W? (y/n)" kill-window

# close pane without confirmation
bind x kill-pane

# centered popup shell
bind s display-popup -E -w 50% -h 100% -d "#{pane_current_path}"

# mouse features
set -g mouse on

# vim stuff
set-option -g focus-events on


############################################################################
## VIM bindings
#############################################################################
set-window-option -g mode-keys vi

# copy to system clipboard via OSC 52 (works cross-platform)
set -s set-clipboard on
set -g allow-passthrough on
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# moving between panes with vim movement keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# resize panes with vim movement keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# split panes in current directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# clear log with k
#bind -n C-k send-keys -R \; clear-history

# Move windows (Ctrl + Shift + arrow)
bind-key -n C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n C-S-Right swap-window -t +1\; select-window -t +1

############################################################################
## Status Bar
#############################################################################
set-option -g status on
set-option -g status-position top
set-option -g status-justify centre
set-option -g status-style 'bg=#1e1e2e,fg=#cdd6f4'
set-option -g status-interval 3
set-option -g status-left-length 60
set-option -g status-right-length 80
set-option -g status-left '#[bg=#b4befe,fg=#1e1e2e,bold] #{host_short} #[bg=#45475a,fg=#b4befe]#[bg=#45475a,fg=#cdd6f4,bold] #{session_name} #[bg=#1e1e2e,fg=#45475a]'
set-option -g status-right '#[fg=#45475a,bg=#1e1e2e]#[bg=#45475a,fg=#cdd6f4] #(~/.local/bin/zjstatus-sysinfo) #[fg=#b4befe,bg=#45475a]#[bg=#b4befe,fg=#1e1e2e,bold] %H:%M '
set-option -g visual-activity on

# Titles (window number, program name, active (or not)
set-option -g set-titles on
set-option -g set-titles-string '#H:#S.#I.#P #W #T'
set-window-option -g window-status-separator ''
set-window-option -g window-status-format '#[bg=#45475a,fg=#1e1e2e]#[bg=#45475a,fg=#cdd6f4] #{window_name} #[bg=#1e1e2e,fg=#45475a]'
set-window-option -g window-status-current-format '#[bg=#b4befe,fg=#1e1e2e]#[bg=#b4befe,fg=#1e1e2e,bold] #{window_name} #[bg=#1e1e2e,fg=#b4befe]'
set-window-option -g pane-border-style 'fg=#9399b2'
set-window-option -g pane-active-border-style 'fg=#d8b4fe'
set-window-option -g pane-border-lines heavy
set-window-option -g pane-border-indicators arrows
set-window-option -g mode-style 'bg=#b4befe,fg=#1e1e2e'
set-option -g message-style 'bg=#45475a,fg=#cdd6f4'

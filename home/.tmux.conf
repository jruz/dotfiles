#Prefix is Ctrl-a
set -g prefix C-a
unbind -a -T prefix
bind -N 'Send Ctrl+a to the application' C-a send-prefix
bind -N 'Select window 1' 1 select-window -t :=1
bind -N 'Select window 2' 2 select-window -t :=2
bind -N 'Select window 3' 3 select-window -t :=3
bind -N 'Select window 4' 4 select-window -t :=4
bind -N 'Select window 5' 5 select-window -t :=5
bind -N 'Select window 6' 6 select-window -t :=6
bind -N 'Select window 7' 7 select-window -t :=7
bind -N 'Select window 8' 8 select-window -t :=8
bind -N 'Select window 9' 9 select-window -t :=9
bind -N 'Enter a tmux command' : command-prompt
bind -N 'Scroll and copy' [ copy-mode
bind -N 'Detach from session' d detach-client
bind -N 'Show shortcuts' ? display-popup -E -w 108 -h 26 -T ' Shortcuts ' 'nu ~/.local/bin/tmux-shortcuts.nu'

# Fix delay of ESC key on neovim
set -sg escape-time 20

# fix window rename
set-option -g allow-rename off

# scrollback size
set -g history-limit 50000

# set first window to index 1 (not 0) to map more to the keyboard layout
set -g base-index 1
setw -g pane-base-index 1

# color and terminal features
set -g default-terminal "tmux-256color"
if-shell '[ "$(uname -s)" = Darwin ]' 'set-option -g default-shell /Users/jruz/.nix-profile/bin/nu' 'set-option -g default-shell /home/jruz/.nix-profile/bin/nu'
set -as terminal-features ",xterm-256color:RGB"
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',*:extkeys'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# renumber windows sequentially after closing any of them
set -g renumber-windows on

# reload ~/.tmux.conf using Ctrl + a + r
bind -N 'Reload configuration' r source-file ~/.tmux.conf \; display-popup -E -w 22 -h 3 'print --no-newline "\e[?25l   Config reloaded!"; sleep 1sec'
set -g @window-picker-max-width 152
bind -N 'Open window picker' w run-shell -b '~/.local/bin/tmux-window-picker open "#{client_name}" #{client_width}'

# reset tab name indicator
bind -N 'Reset tab name indicator' t run-shell 'TMUX_PANE=#{pane_id} ~/dev/projects/agent-config/hooks/tmux-tab-renamer reset'

# rename window starting from an empty prompt
bind -N 'Rename window' , command-prompt { rename-window "%%" }
bind -N 'Rename session' $ command-prompt -I '#S' { rename-session '%%' }
bind -N 'Name window after current folder' m rename-window "#{b:pane_current_path}"

# close window with confirmation
bind -N 'Close window with confirmation' X confirm-before -p "kill-window #W? (y/n)" kill-window

# close pane without confirmation
bind -N 'Close pane' x kill-pane

# centered popup shell
bind -N 'Open popup shell' s display-popup -E -w 50% -h 100% -d "#{pane_current_path}"

# zoom pane to a centered half-width column
bind -N 'Toggle centered zoom' z run-shell '~/.local/bin/tmux-center-zoom #{pane_id}'
bind -N 'Toggle fullscreen zoom' f resize-pane -Z
set-hook -g pane-exited 'run-shell "~/.local/bin/tmux-center-zoom cleanup"'
set-hook -g after-kill-pane 'run-shell "~/.local/bin/tmux-center-zoom cleanup"'
set-hook -g window-unlinked 'run-shell "~/.local/bin/tmux-center-zoom cleanup"'

# mouse features
set -g mouse on

# vim stuff
set-option -g focus-events on


############################################################################
## VIM bindings
#############################################################################
set-window-option -g mode-keys vi
set-option -g status-keys emacs

# copy to system clipboard via OSC 52 (works cross-platform)
set -s set-clipboard on
set -g allow-passthrough on
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# moving between panes with vim movement keys
bind -N 'Focus pane left' h select-pane -L
bind -N 'Focus pane down' j select-pane -D
bind -N 'Focus pane up' k select-pane -U
bind -N 'Focus pane right' l select-pane -R

# resize panes with vim movement keys
bind -r -N 'Resize pane left' H resize-pane -L 5
bind -r -N 'Resize pane down' J resize-pane -D 5
bind -r -N 'Resize pane up' K resize-pane -U 5
bind -r -N 'Resize pane right' L resize-pane -R 5

# split panes in current directory
bind -N 'Split top/bottom' '"' split-window -v -c "#{pane_current_path}"
bind -N 'Split left/right' % split-window -h -c "#{pane_current_path}"
bind -N 'New window in current folder' c new-window -c "#{pane_current_path}"
source-file ~/.config/tmux/sidebar/sidebar.conf

# clear log with k
#bind -n C-k send-keys -R \; clear-history

# Move windows (Ctrl + Shift + arrow)
bind-key -n -N 'Move window left' C-S-Left swap-window -t -1\; select-window -t -1
bind-key -n -N 'Move window right' C-S-Right swap-window -t +1\; select-window -t +1

############################################################################
## Status Bar
#############################################################################
set-option -g status on
set-option -g status-position top
set-option -g status-justify absolute-centre
set-option -g status-style 'bg=#181825,fg=#cdd6f4'
set-option -g status-interval 3
set-option -g status-left-length 60
set-option -g status-right-length 80
set-option -g status-left '#[bg=#b4befe,fg=#1e1e2e,bold] #(hostname -s | tr "[:lower:]" "[:upper:]") #[bg=#45475a,fg=#b4befe]#[bg=#45475a,fg=#cdd6f4,nobold] #{session_name} #[bg=#181825,fg=#45475a]'
set-option -g status-right '#[fg=#45475a,bg=#181825]#[bg=#45475a,fg=#cdd6f4] #(~/.local/bin/zjstatus-sysinfo) #[fg=#b4befe,bg=#45475a]#[bg=#b4befe,fg=#1e1e2e,bold] %H:%M '
set-option -g visual-activity on

# Titles (window number, program name, active (or not)
set-option -g set-titles on
set-option -g set-titles-string '#H:#S.#I.#P #W #T'
set-window-option -g window-status-separator ''
set-window-option -g window-status-format ''
set-window-option -g window-status-current-format '#[bg=#b4befe,fg=#1e1e2e,bold] #{s/ [✻?*]+$//:window_name} '
set-window-option -g pane-border-style 'fg=#9399b2'
set-window-option -g pane-active-border-style 'fg=#d8b4fe'
set-window-option -g pane-border-lines heavy
set-window-option -g pane-border-indicators both
set-window-option -g pane-border-status off
set-window-option -g pane-border-format "#{?pane_active,#[fg=#1e1e2e] #(echo #{q:pane_current_command} | tr '[:lower:]' '[:upper:]') ,}"
set-window-option -g mode-style 'bg=#b4befe,fg=#1e1e2e'
set-option -g message-style 'bg=#45475a,fg=#cdd6f4,fill=#45475a'
set -g @sidebar-width 22
set -g @sidebar-background 'default'
set -g @sidebar-foreground '#cdd6f4'
set -g @sidebar-highlight-background '#b4befe'
set -g @sidebar-highlight-foreground '#1e1e2e'
set -g @sidebar-top-background 'default'

bind -N 'Toggle sidebar' b run-shell 'nu --no-config-file ~/.config/tmux/sidebar/main.nu toggle #{window_id}'
set-hook -g after-new-window[20] 'run-shell "nu --no-config-file ~/.config/tmux/sidebar/main.nu setup #{window_id}"'
set-hook -g after-new-session[20] 'run-shell "nu --no-config-file ~/.config/tmux/sidebar/main.nu setup #{window_id}"'
set-hook -g window-linked[20] 'run-shell -b "nu --no-config-file ~/.config/tmux/sidebar/main.nu refresh"'
set-hook -g window-unlinked[20] 'run-shell -b "nu --no-config-file ~/.config/tmux/sidebar/main.nu refresh"'
set-hook -g window-renamed[20] 'run-shell -b "nu --no-config-file ~/.config/tmux/sidebar/main.nu refresh"'
set-hook -g session-window-changed[20] 'run-shell -b "nu --no-config-file ~/.config/tmux/sidebar/main.nu refresh"'
set-hook -g pane-focus-in[20] 'if-shell -F "#{==:#{@sidebar},on}" { send-keys F6 }'
set-hook -g pane-focus-out[20] 'if-shell -F "#{==:#{@sidebar},on}" { send-keys F7 }'
set-hook -g pane-exited[20] 'run-shell "nu --no-config-file ~/.config/tmux/sidebar/main.nu prune"'
set-hook -g after-kill-pane[20] 'run-shell "nu --no-config-file ~/.config/tmux/sidebar/main.nu prune"'

run-shell -b 'nu --no-config-file ~/.config/tmux/sidebar/main.nu reload'

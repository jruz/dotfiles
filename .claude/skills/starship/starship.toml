format = """
$directory\
$git_branch\
$git_status\
$fill\
$cmd_duration\
$bun\
$nodejs\
$deno\
$rust\
$golang\
$python\
$lua\
$java\
$kotlin\
$c\
$zig\
$ruby\
$php\
$perl\
$elixir\
$haskell\
$scala\
$swift\
$julia\
$nim\
$ocaml\
$crystal\
$dart\
$elm\
$nix_shell\
$docker_context\
$aws\
$gcloud\
$shell\
$line_break\
$character"""

[fill]
symbol = " "

[git_branch]
symbol = "{{ICON_GIT_BRANCH}}"
style = "purple"
format = "[\\($symbol $branch]($style)"

[git_status]
style = "red"
format = "[$ahead_behind](red)[\\)](purple) "
ahead = " {{ARROW_UP}}${count}"
behind = " {{ARROW_DOWN}}${count}"
diverged = " {{ARROW_UPDOWN}}{{ARROW_UP}}${ahead_count}{{ARROW_DOWN}}${behind_count}"
stashed = ""
modified = ""
untracked = ""
staged = ""
deleted = ""
conflicted = ""
renamed = ""
up_to_date = ""

[aws]
symbol = "{{ICON_AWS}}  "

[buf]
symbol = "{{ICON_BUF}} "

[bun]
symbol = "{{ICON_BUN}} "
style = "white"
format = "[$symbol]($style)"

[c]
version_format = "${raw}"
symbol = "{{ICON_C}} "
style = "blue"
format = "[$symbol]($style)"

[cmake]
symbol = "{{ICON_CMAKE}} "

[conda]
symbol = "{{ICON_CONDA}} "

[cmd_duration]
style = "yellow"
format = "[\\($duration\\)]($style) "

[crystal]
symbol = "{{ICON_CRYSTAL}} "
format = "[$symbol]($style)"

[dart]
symbol = "{{ICON_DART}} "
format = "[$symbol]($style)"

[deno]
version_format = "${raw}"
symbol = "{{ICON_DENO}} "
style = "green"
format = "[$symbol]($style)"

[directory]
read_only = " {{ICON_READONLY}}"
truncation_length = 0
truncate_to_repo = false
style = "blue"
repo_root_style = "bold cyan"
before_repo_root_style = "dimmed blue"
format = "[$path]($style) "
repo_root_format = "[$before_root_path]($before_repo_root_style)[$repo_root]($repo_root_style)[$path]($style) "

[docker_context]
symbol = "{{ICON_DOCKER}} "
format = "[$symbol]($style)"

[elixir]
version_format = "${raw}"
symbol = "{{ICON_ELIXIR}} "
format = "[$symbol]($style)"

[elm]
symbol = "{{ICON_ELM}} "
format = "[$symbol]($style)"

[fennel]
symbol = "{{ICON_FENNEL}} "

[fossil_branch]
symbol = "{{ICON_FOSSIL}} "

[gcloud]
symbol = "{{ICON_GCLOUD}}  "


[git_commit]
tag_symbol = '{{ICON_TAG}}  '

[golang]
version_format = "${raw}"
symbol = "{{ICON_GOLANG}} "
style = "cyan"
format = "[$symbol]($style)"

[guix_shell]
symbol = "{{ICON_GUIX}} "

[haskell]
symbol = "{{ICON_HASKELL}} "
format = "[$symbol]($style)"

[haxe]
symbol = "{{ICON_HAXE}} "

[hg_branch]
symbol = "{{ICON_HG}} "

[hostname]
ssh_symbol = "{{ICON_SSH}} "

[java]
version_format = "${raw}"
symbol = "{{ICON_JAVA}} "
style = "red"
format = "[$symbol]($style)"

[julia]
symbol = "{{ICON_JULIA}} "
format = "[$symbol]($style)"

[kotlin]
version_format = "${raw}"
symbol = "{{ICON_KOTLIN}} "
format = "[$symbol]($style)"

[lua]
version_format = "${raw}"
symbol = "{{ICON_LUA}} "
style = "blue"
format = "[$symbol]($style)"

[memory_usage]
symbol = "{{ICON_MEMORY}} "

[meson]
symbol = "{{ICON_MESON}} "

[nim]
symbol = "{{ICON_NIM}} "
format = "[$symbol]($style)"

[nix_shell]
symbol = "{{ICON_NIX}} "
format = "[${symbol}nix]($style) "

[nodejs]
version_format = "${raw}"
symbol = "{{ICON_NODEJS}} "
style = "green"
format = "[$symbol]($style)"

[ocaml]
symbol = "{{ICON_OCAML}} "
format = "[$symbol]($style)"

[os.symbols]
Alpaquita = "{{ICON_OS_ALPAQUITA}} "
Alpine = "{{ICON_OS_ALPINE}} "
